<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>WCoracle · World Cup 2026 Oracle</title>
  <meta name="description" content="The World Cup 2026 Oracle — live forecasts, qualification odds, title chances and value picks." />

  <!-- PWA / iPhone Add-to-Home-Screen -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WCoracle" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-orb">🔮</span>
      <div>
        <h1>WCoracle</h1>
        <p class="subtitle">World Cup 2026 · the Oracle</p>
      </div>
    </div>
    <button id="refreshBtn" class="icon-btn" title="Re-run the Oracle" aria-label="Re-run">↻</button>
  </header>

  <div id="simBar" class="sim-bar" hidden>
    <div class="sim-bar-fill"></div>
    <span class="sim-bar-text">Consulting the Oracle…</span>
  </div>

  <main id="view" class="view"><!-- tab content rendered here --></main>

  <nav class="tabbar" role="tablist">
    <button class="tab is-active" data-tab="oracle"><span>🏆</span>Oracle</button>
    <button class="tab" data-tab="groups"><span>📊</span>Groups</button>
    <button class="tab" data-tab="matches"><span>⚽</span>Matches</button>
    <button class="tab" data-tab="knockout"><span>🥊</span>Knockout</button>
    <button class="tab" data-tab="settings"><span>🎛️</span>Tune</button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
