<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#243168"/>
      <stop offset="60%" stop-color="#121935"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </radialGradient>
    <radialGradient id="orb" cx="42%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#bcd0ff"/>
      <stop offset="45%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#2a3f8f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe89a"/>
      <stop offset="100%" stop-color="#f5b13a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- crystal ball base -->
  <ellipse cx="256" cy="402" rx="118" ry="26" fill="#0a0e1c" opacity="0.7"/>
  <path d="M168 392 q88 34 176 0 l-14 26 q-74 22 -148 0 z" fill="url(#gold)"/>

  <!-- glowing orb -->
  <circle cx="256" cy="236" r="150" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="256" cy="236" r="150" fill="none" stroke="#ffe89a" stroke-width="4" opacity="0.55"/>

  <!-- football seams inside the orb -->
  <g fill="#0b1020" opacity="0.82">
    <polygon points="256,196 286,218 274,253 238,253 226,218"/>
    <polygon points="256,150 232,168 244,196 268,196 280,168"/>
    <polygon points="318,184 300,206 312,236 340,224 342,198"/>
    <polygon points="194,184 212,206 200,236 172,224 170,198"/>
    <polygon points="300,286 278,300 290,328 320,318 318,294"/>
    <polygon points="212,286 234,300 222,328 192,318 194,294"/>
  </g>
  <!-- highlight -->
  <ellipse cx="212" cy="190" rx="40" ry="26" fill="#ffffff" opacity="0.45"/>

  <!-- sparkles -->
  <g fill="#ffe89a">
    <path d="M392 120 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 z"/>
    <path d="M120 300 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 z"/>
  </g>
</svg>
