name: Deploy to GitHub Pages

# Publishes the static app to GitHub Pages on every push to the app branch.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". After that this runs automatically.
on:
  push:
    branches:
      - claude/world-cup-oracle-app-a98nxj
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true # auto-enable Pages so no manual repo setting is needed
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "." # whole repo is the static site
      - id: deployment
        uses: actions/deploy-pages@v4
