name: Update results

# Auto-pulls the latest WC2026 group-stage results into data/results.json and
# commits them, so the app self-updates. Manual scores in the app always win.
on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch: {}     # run on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/world-cup-oracle-app-a98nxj

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch latest results
        # Optional: set a custom feed via repo Variables/Secrets -> WCORACLE_SOURCE_URL
        env:
          WCORACLE_SOURCE_URL: ${{ vars.WCORACLE_SOURCE_URL }}
        run: node scripts/fetch-results.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/results.json)" ]; then
            git config user.name "wcoracle-bot"
            git config user.email "actions@github.com"
            git add data/results.json
            git commit -m "chore: auto-update WC2026 results"
            git push
            echo "Results updated."
          else
            echo "No changes."
          fi
